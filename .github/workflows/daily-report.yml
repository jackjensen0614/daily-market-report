name: Daily Market Report

on:
  push:
    branches: [main]   # deploy immediately on every push to main
  schedule:
    # Every 5 min during trading hours 9:25 AM–4:05 PM ET (13:25–20:05 UTC) Mon–Fri
    # GitHub minimum cron interval is 5 minutes
    - cron: '*/5 13-20 * * 1-5'
    # Pre-market at 8:00 AM ET and post-market recap at 4:30 PM ET
    - cron: '0 12 * * 1-5'
    - cron: '30 20 * * 1-5'
  workflow_dispatch:   # allow manual trigger from GitHub UI

permissions:
  contents: write   # needed to commit briefings + scorecard grades back to main
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPICAPIKEY }}
        run: |
          mkdir -p dist
          python3 daily_market_report.py --no-open --out dist/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # Persist the learning loop back to the repo. The pre-market run (0 12)
      # locks in the day's predictions (briefing-*.json); the post-market run
      # (30 20) persists that day's grades (scorecard_history.json). Skipped on
      # the every-5-min cron so it never spams commits. continue-on-error means
      # a git failure can never block the Pages deploy.
      - name: Persist briefings + scorecard grades
        if: >
          github.event_name == 'workflow_dispatch' ||
          github.event.schedule == '0 12 * * 1-5' ||
          github.event.schedule == '30 20 * * 1-5'
        continue-on-error: true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- briefing-*.json scorecard_history.json
          if git diff --cached --quiet; then
            echo "No new briefings or grades to persist."
            exit 0
          fi
          # [skip ci] + GITHUB_TOKEN both prevent this push from re-triggering the build.
          git commit -m "chore: persist briefings + scorecard grades [skip ci]"
          git push origin HEAD:main || {
            echo "Push rejected — rebasing on latest main and retrying."
            git pull --rebase origin main
            git push origin HEAD:main
          }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
