
    <div class="tile tile-{{ cls }}">
      <div class="label">{{ q.name }}</div>
      <div class="tile-body">
        <div class="tile-figures">
          <div class="value num">{{ price }}</div>
          <div class="delta num {{ cls }}">{{ delta }}</div>
        </div>
        {% if spark %}<div class="tile-spark">{{ spark }}</div>{% endif %}
      </div>
      {% if wk52 %}
      <div class="tile-range zone-{{ wk52.zone }}" title="{{ wk52.title }}">
        <div class="tr-track">
          <div class="tr-fill" style="width:{{ wk52.pos }}%"></div>
          <div class="tr-marker" style="left:{{ wk52.pos }}%"></div>
        </div>
        <div class="tr-labels">
          <span class="tr-lo num adv-only">{{ wk52.low }}</span>
          <span class="tr-cap"><span class="std-only">{{ wk52.plain }}</span><span class="adv-only">52-wk · {{ wk52.from_high }} from high</span></span>
          <span class="tr-hi num adv-only">{{ wk52.high }}</span>
        </div>
      </div>
      {% endif %}
    </div>
